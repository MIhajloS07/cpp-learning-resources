<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="C++ Learning Resources - from your first program to modern, efficient software" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>C++ Learning Resources</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060a16"/><stop offset="0.55" stop-color="#0b1330"/><stop offset="1" stop-color="#0f1a3c"/>
    </linearGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#1f7bd8" stop-opacity="0.4"/><stop offset="1" stop-color="#1f7bd8" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowP" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#7a5cff" stop-opacity="0.32"/><stop offset="1" stop-color="#7a5cff" stop-opacity="0"/></radialGradient>
    <linearGradient id="gTitle" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#8fc4ff"/></linearGradient>
    <linearGradient id="gSub" gradientUnits="userSpaceOnUse" x1="62" y1="0" x2="520" y2="0">
      <stop offset="0" stop-color="#4aa3ff"/><stop offset="0.5" stop-color="#7f8cff"/><stop offset="1" stop-color="#a47bff"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-120 0;120 0;-120 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="gLine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1f7bd8" stop-opacity="0"/><stop offset="0.5" stop-color="#6f8dff"/><stop offset="1" stop-color="#a47bff" stop-opacity="0"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#6f8dff" opacity="0.16"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.55"/></filter>
    <clipPath id="card"><rect width="1200" height="340" rx="18"/></clipPath>
    <clipPath id="edClip"><rect x="706" y="26" width="426" height="172" rx="10"/></clipPath>
  </defs>

  <style>
    text { font-family: 'Segoe UI','Inter',-apple-system,'Helvetica Neue',Arial,sans-serif; }
    .mono { font-family: 'Cascadia Code',Consolas,'SF Mono',Menlo,monospace; }
    .orbA { animation: dA 14s ease-in-out infinite alternate; } .orbB { animation: dB 17s ease-in-out infinite alternate; }
    @keyframes dA { to { transform: translate(70px,-30px); } } @keyframes dB { to { transform: translate(-80px,30px); } }
    .tw { animation: tw 4s ease-in-out infinite; } @keyframes tw { 0%,100% { opacity:.15 } 50% { opacity:.9 } }
    .rise { opacity:0; animation: rise .9s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0; transform: translateY(14px) } to { opacity:1; transform: translateY(0) } }
    .d1{animation-delay:.1s}.d2{animation-delay:.3s}.d3{animation-delay:.5s}.d4{animation-delay:.7s}.d5{animation-delay:.9s}
    .float { animation: bob 6s ease-in-out infinite; } @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
    .code { opacity:0; animation: ti .6s ease forwards; } @keyframes ti { from { opacity:0; transform: translateX(-8px) } to { opacity:1; transform: translateX(0) } }
    .caret { animation: bl 1s steps(1) infinite; } @keyframes bl { 50% { opacity:0 } }
    .l1 { animation: l1 10s infinite; } .l2 { animation: l2 10s infinite; } .l3 { animation: l3 10s infinite; } .l4 { animation: l4 10s infinite; }
    @keyframes l1 { 0%,4% {opacity:0} 6%,94% {opacity:1} 98%,100% {opacity:0} }
    @keyframes l2 { 0%,24% {opacity:0} 26%,94% {opacity:1} 98%,100% {opacity:0} }
    @keyframes l3 { 0%,36% {opacity:0} 38%,94% {opacity:1} 98%,100% {opacity:0} }
    @keyframes l4 { 0%,48% {opacity:0} 50%,94% {opacity:1} 98%,100% {opacity:0} }
    .cell { animation: cell 3.6s ease-in-out infinite; }
    @keyframes cell { 0%,100% { fill:#17203d; stroke:#2f3b66 } 15%,30% { fill:#1d4f9c; stroke:#6aa8ff } 45% { fill:#17203d; stroke:#2f3b66 } }
    .ptr { animation: ptr 3.6s steps(1) infinite; }
    @keyframes ptr { 0% { transform: translateX(0) } 33.3% { transform: translateX(64px) } 66.6% { transform: translateX(128px) } }
    .hp { animation: hp 6s infinite; opacity:0; }
    @keyframes hp { 0%,8% {opacity:0; transform: scale(.4)} 14%,86% {opacity:1; transform: scale(1)} 94%,100% {opacity:0; transform: scale(1)} }
    .hp { transform-box: fill-box; transform-origin: center; }
    .scan { animation: scan 5s linear infinite; } @keyframes scan { from { transform: translateX(-60px) } to { transform: translateX(1260px) } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .rise,.code,.hp,.l1,.l2,.l3,.l4 { opacity:1 !important; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="url(#bg)"/><rect width="1200" height="340" fill="url(#dots)"/>
    <g class="orbA"><circle cx="150" cy="320" r="260" fill="url(#glowB)"/></g>
    <g class="orbB"><circle cx="1010" cy="40" r="280" fill="url(#glowP)"/></g>
    <g fill="#9db8ff">
      <circle class="tw" cx="560" cy="48" r="1.8"/><circle class="tw" cx="610" cy="300" r="1.5" style="animation-delay:1.2s"/>
      <circle class="tw" cx="470" cy="120" r="1.4" style="animation-delay:2.1s"/><circle class="tw" cx="1170" cy="120" r="1.6" style="animation-delay:.7s"/>
      <circle class="tw" cx="30" cy="30" r="1.6" style="animation-delay:1.8s"/>
    </g>

    <!-- text -->
    <g class="rise d1">
      <rect x="62" y="62" width="30" height="3" rx="1.5" fill="#4aa3ff"/>
      <text x="104" y="68" font-size="13" font-weight="600" letter-spacing="2.4" fill="#7fb6ff">C++  ·  LEARNING RESOURCES</text>
    </g>
    <text class="rise d2" x="58" y="156" font-size="96" font-weight="800" letter-spacing="-2" fill="url(#gTitle)">C++</text>
    <text class="rise d3" x="62" y="208" font-size="46" font-weight="300" letter-spacing="-0.5" fill="url(#gSub)">Learning Resources</text>
    <text class="rise d4" x="63" y="250" font-size="18" fill="#9fb0d0">From your first program to modern, efficient software.</text>
    <g class="rise d5">
      <rect x="62.5" y="274.5" width="142" height="38" rx="19" fill="#fff" fill-opacity="0.05" stroke="#6f8dff" stroke-opacity="0.35"/>
      <circle cx="82" cy="293.5" r="4" fill="#4aa3ff"/><text x="94" y="299" font-size="15" fill="#c6d2ee">Fundamentals</text>
      <rect x="216.5" y="274.5" width="120" height="38" rx="19" fill="#fff" fill-opacity="0.05" stroke="#6f8dff" stroke-opacity="0.35"/>
      <circle cx="236" cy="293.5" r="4" fill="#7f8cff"/><text x="248" y="299" font-size="15" fill="#c6d2ee">OOP &amp; STL</text>
      <rect x="348.5" y="274.5" width="108" height="38" rx="19" fill="#fff" fill-opacity="0.05" stroke="#6f8dff" stroke-opacity="0.35"/>
      <circle cx="368" cy="293.5" r="4" fill="#a47bff"/><text x="380" y="299" font-size="15" fill="#c6d2ee">Projects</text>
    </g>

    <!-- editor -->
    <g class="float" style="animation-delay:-2s">
      <g filter="url(#shadow)"><rect x="706" y="26" width="426" height="172" rx="10" fill="#14192b" stroke="#2b3354"/></g>
      <rect x="706" y="26" width="426" height="30" rx="10" fill="#1b2136"/><rect x="706" y="46" width="426" height="10" fill="#1b2136"/>
      <circle cx="726" cy="41" r="5.5" fill="#ff5f57"/><circle cx="745" cy="41" r="5.5" fill="#febc2e"/><circle cx="764" cy="41" r="5.5" fill="#28c840"/>
      <text x="919" y="45" font-size="12" fill="#7e89aa" text-anchor="middle">main.cpp</text>
      <g clip-path="url(#edClip)" class="mono" font-size="13">
        <g fill="#4a5578"><text x="724" y="84">1</text><text x="724" y="108">2</text><text x="724" y="132">3</text><text x="724" y="156">4</text><text x="724" y="180">5</text></g>
        <text class="code" style="animation-delay:1s" x="758" y="84"><tspan fill="#c586c0">#include</tspan><tspan fill="#ce9178"> &lt;iostream&gt;</tspan></text>
        <text class="code" style="animation-delay:1.4s" x="758" y="108"><tspan fill="#569cd6">int</tspan><tspan fill="#dcdcaa"> main</tspan><tspan fill="#d4d4d4">() {</tspan></text>
        <text class="code" style="animation-delay:1.8s" x="780" y="132"><tspan fill="#4ec9b0">std</tspan><tspan fill="#d4d4d4">::cout &lt;&lt; </tspan><tspan fill="#ce9178">"Hello, C++!"</tspan><tspan fill="#d4d4d4">;</tspan></text>
        <text class="code" style="animation-delay:2.2s" x="780" y="156"><tspan fill="#c586c0">return</tspan><tspan fill="#b5cea8"> 0</tspan><tspan fill="#d4d4d4">;</tspan></text>
        <text class="code" style="animation-delay:2.6s" x="758" y="180" fill="#d4d4d4">}</text>
        <rect class="caret" x="768" y="168" width="7" height="14" fill="#6aa8ff" opacity="0"/>
      </g>
    </g>

    <!-- terminal -->
    <g class="float" style="animation-delay:-4s">
      <g filter="url(#shadow)"><rect x="630" y="120" width="310" height="190" rx="9" fill="#0a0e1b" stroke="#2b3354"/></g>
      <rect x="630" y="120" width="310" height="28" rx="9" fill="#171d33"/><rect x="630" y="138" width="310" height="10" fill="#171d33"/>
      <circle cx="646" cy="134" r="4.5" fill="#ff5f57"/><circle cx="661" cy="134" r="4.5" fill="#febc2e"/><circle cx="676" cy="134" r="4.5" fill="#28c840"/>
      <text x="785" y="138" font-size="12" fill="#7e89aa" text-anchor="middle">Terminal</text>
      <g class="mono" font-size="13">
        <text class="l1" x="648" y="180"><tspan fill="#28c840">$</tspan><tspan fill="#e6edf7"> g++ -std=c++20 main.cpp -o app</tspan></text>
        <text class="l2" x="648" y="208"><tspan fill="#28c840">$</tspan><tspan fill="#e6edf7"> ./app</tspan></text>
        <text class="l3" x="648" y="236" fill="#7fd1ff">Hello, C++!</text>
        <text class="l4" x="648" y="264"><tspan fill="#28c840">$</tspan><tspan fill="#6aa8ff" class="caret"> ▌</tspan></text>
      </g>
    </g>

    <!-- memory card -->
    <g class="float" style="animation-delay:-1s">
      <g filter="url(#shadow)"><rect x="950" y="166" width="214" height="150" rx="10" fill="#10162a" stroke="#2b3354"/></g>
      <rect x="950" y="166" width="214" height="28" rx="10" fill="#1b2136"/><rect x="950" y="184" width="214" height="10" fill="#1b2136"/>
      <text x="966" y="185" font-size="12" fill="#8c97b8">Memory · stack &amp; heap</text>
      <g class="mono" font-size="12" text-anchor="middle">
        <rect class="cell" x="966" y="208" width="56" height="34" rx="6" fill="#17203d" stroke="#2f3b66" style="animation-delay:0s"/>
        <rect class="cell" x="1030" y="208" width="56" height="34" rx="6" fill="#17203d" stroke="#2f3b66" style="animation-delay:1.2s"/>
        <rect class="cell" x="1094" y="208" width="56" height="34" rx="6" fill="#17203d" stroke="#2f3b66" style="animation-delay:2.4s"/>
        <text x="994" y="230" fill="#dbe7ff">42</text><text x="1058" y="230" fill="#dbe7ff">7</text><text x="1122" y="230" fill="#dbe7ff">19</text>
        <g fill="#6d7aa3" font-size="10"><text x="994" y="256">0x10</text><text x="1058" y="256">0x14</text><text x="1122" y="256">0x18</text></g>
        <g class="ptr"><path d="M988 262l6 -8h-12z" fill="#a47bff" transform="translate(6 0)"/><text x="994" y="276" fill="#a47bff" font-size="11">ptr</text></g>
      </g>
      <g>
        <text x="966" y="302" font-size="10" fill="#6d7aa3" class="mono">heap</text>
        <rect class="hp" x="1000" y="292" width="20" height="14" rx="3" fill="#4aa3ff" style="animation-delay:0s"/>
        <rect class="hp" x="1026" y="292" width="20" height="14" rx="3" fill="#6f8dff" style="animation-delay:.4s"/>
        <rect class="hp" x="1052" y="292" width="20" height="14" rx="3" fill="#7f8cff" style="animation-delay:.8s"/>
        <rect class="hp" x="1078" y="292" width="20" height="14" rx="3" fill="#9a84ff" style="animation-delay:1.2s"/>
        <rect class="hp" x="1104" y="292" width="20" height="14" rx="3" fill="#a47bff" style="animation-delay:1.6s"/>
      </g>
    </g>

    <rect x="0" y="336" width="1200" height="4" fill="url(#gLine)" opacity="0.7"/>
    <rect class="scan" x="0" y="336" width="60" height="4" fill="#cfe0ff" opacity="0.55"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="18" fill="none" stroke="#2b3354" stroke-opacity="0.8"/>
</svg>
